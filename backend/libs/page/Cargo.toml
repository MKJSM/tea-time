[package]
name = "backend_page"
version = "0.1.0"
edition = "2021"

[dependencies]
backend_shared = { path = "../../crates/shared" }
deadpool-postgres = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
uuid = { version = "1", features = ["v4"] }
