[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sailfish = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
uuid = { version = "1.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
rand_core = { version = "0.6", features = ["std"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "json"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
tower-sessions = "0.13"
tower-sessions-sqlx-store = { version = "0.14", features = ["sqlite"] }
time = "0.3"
validator = { version = "0.18", features = ["derive"] }
tower_governor = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }