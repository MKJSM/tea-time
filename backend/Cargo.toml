[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = { version = "0.5" }
async-trait = { version = "0.1.89" }
aws-config = { version = "1.5" }
aws-sdk-s3 = { version = "1.71" }
axum = { version = "0.8.8", features = ["multipart"] }
base64 = { version = "0.22" }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = { version = "0.15" }
hex = { version = "0.4" }
hmac = { version = "0.12" }
once_cell = { version = "1.19" }
rand_core = { version = "0.9.5", features = ["std"] }
regex = { version = "1.10" }
reqwest = { version = "0.12", features = ["json"] }
sailfish = { version = "0.10.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.10" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid"] }
subtle = { version = "2.5" }
time = { version = "0.3" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors", "compression-gzip", "set-header"] }
tower-sessions = { version = "0.14.0" }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tower_governor = { version = "0.8.0" }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
axum-test = { version = "18.7.0" }
fake = { version = "4.4.0", features = ["derive", "uuid", "chrono"] }
once_cell = { version = "1.19" }
testcontainers = { version = "0.26.3" }
testcontainers-modules = { version = "0.14.0", features = ["postgres"] }
tokio-test = { version = "0.4" }
wiremock = { version = "0.6" }
