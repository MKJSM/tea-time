[package]
name = "backend_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
aws-config = "1"
aws-sdk-s3 = "1"
backend_address = { path = "../libs/address" }
backend_admin = { path = "../libs/admin" }
backend_auth = { path = "../crates/auth" }
backend_banner = { path = "../libs/banner" }
backend_category = { path = "../libs/category" }
backend_customer = { path = "../libs/customer" }
backend_db = { path = "../crates/db" }
backend_order = { path = "../libs/order" }
backend_payment = { path = "../libs/payment" }
backend_product = { path = "../libs/product" }
backend_session = { path = "../crates/session" }
backend_shared = { path = "../crates/shared" }
deadpool-postgres = "0.14"
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
